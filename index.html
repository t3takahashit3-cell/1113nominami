<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOZAWA QUEST - 地元企業攻略RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --dq-bg: #050811;
      --dq-win: #0f172a;
      --dq-border: #e2e8f0;
      --dq-gold: #facc15;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--dq-bg);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(30, 58, 138, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(88, 28, 135, 0.25) 0%, transparent 50%);
      color: #f8fafc;
      font-family: 'DotGothic16', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* レトロRPGウィンドウ枠 */
    .rpg-window {
      background: rgba(15, 23, 42, 0.95);
      border: 4px solid #f8fafc;
      border-radius: 12px;
      box-shadow: 
        inset 0 0 0 2px #0f172a,
        0 10px 30px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .rpg-window-gold {
      background: rgba(15, 23, 42, 0.96);
      border: 4px solid #facc15;
      border-radius: 12px;
      box-shadow: 
        inset 0 0 0 2px #0f172a,
        0 0 25px rgba(250, 204, 21, 0.35);
    }

    /* RPGコマンドボタン */
    .rpg-btn {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      color: #f8fafc;
      padding: 12px 20px;
      font-family: 'DotGothic16', 'Noto Sans JP', sans-serif;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .rpg-btn:hover:not(:disabled) {
      border-color: #facc15;
      color: #facc15;
      transform: translateX(4px);
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
    }

    .rpg-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .rpg-btn-primary {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      border: 3px solid #fef08a;
      color: #090d16;
      font-weight: 900;
      text-align: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
    }

    .rpg-btn-primary:hover:not(:disabled) {
      background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
      color: #000;
      transform: scale(1.03);
    }

    /* 魔物ダメージ・撃破アニメーション */
    @keyframes monsterShake {
      0%, 100% { transform: translate(0, 0) scale(1); filter: brightness(1); }
      15% { transform: translate(-18px, -8px) scale(0.96); filter: brightness(2.5) sepia(1) hue-rotate(-50deg) saturate(5); }
      30% { transform: translate(18px, 6px) scale(1.04); filter: brightness(2); }
      45% { transform: translate(-14px, 4px) scale(0.98); filter: brightness(2.5) sepia(1) hue-rotate(-50deg) saturate(5); }
      60% { transform: translate(14px, -6px) scale(1.02); }
      75% { transform: translate(-8px, 2px); }
    }

    .monster-damage {
      animation: monsterShake 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    /* 斬撃エフェクト＆イラスト切断演出 */
    .slash-container {
      position: relative;
      display: inline-block;
      overflow: hidden;
    }

    .slash-line {
      position: absolute;
      top: 50%;
      left: -30%;
      width: 160%;
      height: 10px;
      background: linear-gradient(90deg, transparent, #ffffff, #38bdf8, #ffffff, transparent);
      box-shadow: 0 0 25px #38bdf8, 0 0 45px #ffffff;
      transform: rotate(-28deg) scaleX(0);
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    @keyframes slashStrike {
      0% { transform: rotate(-28deg) scaleX(0); opacity: 1; }
      40% { transform: rotate(-28deg) scaleX(1); opacity: 1; }
      100% { transform: rotate(-28deg) scaleX(1.2); opacity: 0; }
    }

    .slash-active .slash-line {
      animation: slashStrike 0.55s ease-out forwards;
    }

    @keyframes monsterSplitDefeat {
      0% { transform: scale(1); filter: brightness(1); opacity: 1; }
      25% { transform: scale(1.08); filter: brightness(4) contrast(2); opacity: 1; }
      55% { transform: skewX(28deg) translateX(25px) scaleY(0.85); filter: brightness(2) hue-rotate(90deg) blur(2px); opacity: 0.7; }
      100% { transform: skewX(-35deg) translateY(40px) scale(0.2); filter: blur(10px); opacity: 0; }
    }

    .monster-sliced {
      animation: monsterSplitDefeat 0.95s ease-in-out forwards;
    }

    /* 大魔王フェードイン演出 */
    @keyframes maouAppear {
      0% { opacity: 0; transform: scale(0.65) translateY(30px); filter: brightness(0) drop-shadow(0 0 0px #a855f7); }
      40% { opacity: 0.6; filter: brightness(0.4) drop-shadow(0 0 40px #9333ea); }
      75% { opacity: 0.9; transform: scale(1.06) translateY(-5px); filter: brightness(1.6) drop-shadow(0 0 60px #ef4444); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1) drop-shadow(0 0 25px #a855f7); }
    }

    .maou-fadein {
      animation: maouAppear 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* プレイヤー被ダメージ時の画面揺れ */
    @keyframes screenDamage {
      0%, 100% { transform: translate(0, 0); background-color: var(--dq-bg); }
      20% { transform: translate(-12px, 8px); background-color: rgba(185, 28, 28, 0.45); }
      40% { transform: translate(12px, -8px); background-color: rgba(185, 28, 28, 0.3); }
      60% { transform: translate(-8px, -6px); }
      80% { transform: translate(8px, 6px); }
    }

    .player-damaged {
      animation: screenDamage 0.45s ease-in-out;
    }

    /* 商人ステージ：契約書（巻物デザイン） */
    .contract-scroll {
      background: #fef3c7;
      background-image: radial-gradient(#fde68a 1px, transparent 1px);
      background-size: 16px 16px;
      color: #1c1917;
      border: 6px double #78350f;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      font-family: 'Noto Sans JP', serif;
    }

    /* 赤丸（赤ペン添削）エフェクト */
    .contract-item {
      position: relative;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 8px;
      border: 2px dashed #a8a29e;
      transition: all 0.15s ease;
      background: rgba(255, 255, 255, 0.65);
    }

    .contract-item:hover {
      background: rgba(254, 226, 226, 0.5);
      border-color: #ef4444;
    }

    .contract-item.circled {
      background: rgba(254, 226, 226, 0.85);
      border: 2px solid #dc2626;
    }

    .red-circle-mark {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-4deg);
      width: 94%;
      height: 86%;
      border: 4px solid #dc2626;
      border-radius: 50% 45% 52% 48%;
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
      pointer-events: none;
    }

    .contract-item.circled .red-circle-mark {
      display: block;
    }

    /* エンディング紙吹雪アニメーション */
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 12px;
      height: 12px;
      z-index: 50;
      pointer-events: none;
      animation: confettiFall linear infinite;
    }
  </style>
</head>
<body id="game-body" class="flex flex-col items-center justify-center min-h-screen p-3 md:p-6">

  <!-- ステータスヘッダー（本編・商人ステージ中のみ表示） -->
  <header id="hud-bar" class="hidden w-full max-w-4xl mb-3 grid grid-cols-1 md:grid-cols-2 gap-3 z-20">

      </div>

  </header>

  <!-- メインゲームコンテナ -->
  <main id="main-screen" class="w-full max-w-4xl rpg-window p-4 md:p-7 relative overflow-hidden">
    <!-- 各画面のコンテンツがここにレンダリングされます -->
  </main>

  <!-- トースト通知 / 会心の一撃・アイテム効果ポップアップ -->
  <div id="effect-banner" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-4">
    <div id="effect-banner-inner" class="px-6 py-3 rounded-xl border-2 border-yellow-300 bg-slate-900/95 text-yellow-300 font-bold text-lg shadow-2xl flex items-center gap-3">
      <i class="fa-solid fa-bolt"></i>
      <span id="effect-banner-text">会心の一撃！</span>
    </div>
  </div>

  <!-- 企業HP確認・解説モーダル -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
    <div class="rpg-window-gold w-full max-w-2xl p-6 animate-fadeIn">
      <h3 id="modal-title" class="text-xl md:text-2xl font-bold text-amber-400 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i> 解説
      </h3>
      <div id="modal-body" class="text-slate-100 text-base md:text-lg leading-relaxed mb-6 whitespace-pre-line font-sans"></div>
      <div class="flex justify-end">
        <button id="modal-next-btn" class="rpg-btn rpg-btn-primary px-8 py-3 text-lg">
          次へ進む <i class="fa-solid fa-caret-right ml-2"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ==============================================================
       1. アセットURL定義 (すべて raw.githubusercontent.com 形式に変換済み)
       ============================================================== */
    const ASSETS = {
      topImg: "https://raw.githubusercontent.com/t3takahashit3-cell/1113nominami/main/top.jpg",
      title2Img: "https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/title2.jpg",
      kamiImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261029matsukawa/main/kami.jpg",
      overImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261029matsukawa/main/over.jpg",
      zombieImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/zn.gif",
      goblinImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/gb.gif",
      minoImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/mi.gif",
      merchantImg: "https://raw.githubusercontent.com/t3takahashit3-cell/1113nominami/main/syouinin.jpg",
      dragonImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/dr.gif",
      maouImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/mao.gif",
      endingImg: "https://raw.githubusercontent.com/t3takahashit3-cell/20261029matsukawa/main/title.jpg",

      bgmOpening: "https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/mu.mp3",
      bgmOver: "https://raw.githubusercontent.com/t3takahashit3-cell/20261029matsukawa/main/over.mp3",
      bgmEnding: "https://raw.githubusercontent.com/t3takahashit3-cell/20261029matsukawa/main/ed.mp3",
      bgmMaou: "https://raw.githubusercontent.com/t3takahashit3-cell/1113nominami/main/maoubgm.mp3"
    };

    /* ==============================================================
       2. 企業公式HPリンク辞書（別タブで企業HPを開く機能用）
       ============================================================== */
    const COMPANY_URLS = {
      "長野県Aコープ": "https://www.nagano-acoop.co.jp/",
      "デリシア": "https://www.delicia-web.co.jp/",
      "ツルヤ": "https://www.tsuruya-corp.co.jp/",
      "ニシザワ": "https://www.nishizawa.co.jp/",
      "ビッグ": "https://www.aeonbig.co.jp/",
      "ルートインジャパン": "https://www.route-inn.co.jp/",
      "シャトレーゼリゾート八ヶ岳": "https://www.chateraiseresort.co.jp/",
      "池の平ホテル＆リゾーツ": "https://www.ikenotaira-resort.co.jp/",
      "星野リゾート": "https://hoshinoresorts.com/jp/",
      "ホテル国際２１": "https://www.kokusai21.jp/",
      "丸信製作所": "https://www.sakums.co.jp/",
      "エンドレスプロジェクト": "https://endless-sport.co.jp/",
      "アート金属工業": "https://www.aisin.com/jp/group/art-piston/",
      "浅間技研工業": "https://www.kiriu.co.jp/asamagiken/",
      "エムケーカシヤマ": "https://www.mk-kashiyama.com/",
      "樫山工業": "https://www.kashiyama.com/",
      "ミネベアミツミ": "https://www.minebeamitsumi.com/",
      "シチズンマシナリー": "https://cmj.citizen.co.jp/",
      "小諸村田製作所": "https://corporate.murata.com/ja-jp/group/komoromurata",
      "日精エーエスビー機械": "https://www.nisseiasb.co.jp/ja/",
      "和泉屋菓子店": "https://www.izumiya-saku.co.jp/",
      "玉屋": "http://www.kashi-tamaya.co.jp/",
      "サクマ製菓": "https://www.sakumaseika.com/",
      "ケーキブティック ピータース": "http://www.peter-s.jp/",
      "ブラウンエッグファーム": "https://www.chatamaya.com/",
      "小諸病院": "https://komoro-hosp.jp/",
      "恵仁会": "https://www.keijinnet.or.jp/",
      "長野県厚生農業協同組合連合会（JA長野厚生連）": "https://www.nagano-kouseiren.jp/",
      "長野県立病院機構": "https://www.pref-nagano-hosp.jp/honbu/",
      "佐久市立国保浅間総合病院": "https://asamaghp.jp/",
      "竹花組": "https://www.takehanagumi.co.jp/",
      "新津組": "https://www.niitsu-gumi.co.jp/",
      "黒沢組": "https://kurosawagumi.co.jp/",
      "小宮山土木": "https://komiyama.jp/",
      "北野建設": "https://www.kitano.co.jp/",
      "ミマキエンジニアリング": "https://japan.mimaki.com/",
      "相馬商事": "https://www.somashoji.co.jp/",
      "ヤッホーブルーイング": "https://yohobrewing.com/"
    };

    // シャッフル用ユーティリティ関数
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    /* ==============================================================
       3. サウンドエンジン（BGM & Web Audio API レトロ効果音）
       ============================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.currentBgm = null;
        // BGM用のAudioオブジェクトをあらかじめグローバルで生成
        this.bgms = {
          [ASSETS.bgmOpening]: new Audio(ASSETS.bgmOpening),
          [ASSETS.bgmOver]: new Audio(ASSETS.bgmOver),
          [ASSETS.bgmEnding]: new Audio(ASSETS.bgmEnding),
          [ASSETS.bgmMaou]: new Audio(ASSETS.bgmMaou)
        };
        // スマホ等での遅延を防ぐため全オーディオを事前ロード設定
        Object.values(this.bgms).forEach(audio => {
          audio.preload = "auto";
          audio.volume = 0.45;
        });
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // スマホの音声再生ブロックを解除するための処理
      unlockAudio(excludeUrl = null) {
        this.initContext();
        // 初回タップ時に全BGMをロード＆無音再生してiOS/Androidの音声制限を解除する
        Object.entries(this.bgms).forEach(([url, audio]) => {
          audio.load();
          // これから再生する曲（excludeUrl）以外は、無音で一瞬だけ再生してすぐに止める
          if (url !== excludeUrl) {
            audio.volume = 0;
            audio.play().then(() => {
              audio.pause();
              audio.currentTime = 0;
              audio.volume = 0.45;
            }).catch(() => {});
          }
        });
      }

      playBGM(url, loop = true) {
        this.stopBGM();
        const audio = this.bgms[url];
        if (audio) {
          audio.loop = loop;
          audio.volume = 0.45;
          audio.currentTime = 0;
          audio.play().catch(() => {
            // ユーザー操作後に再生可能
          });
          this.currentBgm = audio;
        }
      }

      stopBGM() {
        if (this.currentBgm) {
          this.currentBgm.pause();
          this.currentBgm.currentTime = 0;
        }
      }

      // 昔のゲーム風の「ピピピピ」文字送り音
      playTextBeep() {
        this.initContext();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(740, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.035);
      }

      // コマンド選択音
      playClick() {
        this.initContext();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.07, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.09);
      }

      // 不正解時の「ブブ！」音
      playBuzzer() {
        this.initContext();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(115, now + 0.15);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.38);
      }

      // 通常ダメージヒット音
      playAttackHit() {
        this.initContext();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';

    /* ==============================================================

       ============================================================== */
    function clearTimers() {
      if (state.typewriterTimer) {
        clearInterval(state.typewriterTimer);
        state.typewriterTimer = null;
      }
      if (state.countdownTimer) {
        clearInterval(state.countdownTimer);
        state.countdownTimer = null;
      }
    }

    // 昔のゲーム風に1文字ずつ「ピピピピ」と表示
    function typeText(elementId, text, speed = 45, onComplete = null) {
      if (state.typewriterTimer) clearInterval(state.typewriterTimer);
      const el = document.getElementById(elementId);
      if (!el) return;
      el.textContent = "";
      let idx = 0;
      state.typewriterTimer = setInterval(() => {
        if (idx < text.length) {
          el.textContent += text[idx];
          if (text[idx].trim() !== "" && idx % 2 === 0) {
            sound.playTextBeep();
          }
          idx++;
        } else {
          clearInterval(state.typewriterTimer);
          state.typewriterTimer = null;
          if (onComplete) onComplete();
        }
      }, speed);
    }

    function showEffectBanner(message, colorClass = "text-yellow-300 border-yellow-300") {
      const banner = document.getElementById('effect-banner');
      const inner = document.getElementById('effect-banner-inner');
      const text = document.getElementById('effect-banner-text');
      inner.className = `px-6 py-3 rounded-xl border-2 bg-slate-900/95 font-bold text-lg shadow-2xl flex items-center gap-3 ${colorClass}`;
      text.textContent = message;
      banner.classList.remove('opacity-0', '-translate-y-4');
      banner.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-4');
      }, 2400);
    }

    function showModal(title, bodyText, onNext) {
      const overlay = document.getElementById('modal-overlay');
      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-scroll mr-2"></i>${title}`;
      document.getElementById('modal-body').textContent = bodyText;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      const btn = document.getElementById('modal-next-btn');
      btn.onclick = () => {
        sound.playClick();
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        if (onNext) onNext();
      };
    }

    function updateHUD() {
      const job = JOB_DATA[state.jobKey];
      document.getElementById('hud-job-icon').textContent = job.icon;
      document.getElementById('hud-job').textContent = job.name;
      document.getElementById('hud-name').textContent = state.playerName;
      document.getElementById('hud-hp').textContent = state.hp;
      document.getElementById('hud-maxhp').textContent = state.maxHp;
      document.getElementById('hud-score').textContent = state.score;

      const ratio = Math.max(0, Math.min(100, Math.round((state.hp / state.maxHp) * 100)));
      const hpBar = document.getElementById('hud-hp-bar');
      hpBar.style.width = `${ratio}%`;
      if (ratio <= 25) {
        hpBar.className = "bg-gradient-to-r from-red-600 to-rose-500 h-full transition-all duration-300";
      } else if (ratio <= 50) {
        hpBar.className = "bg-gradient-to-r from-amber-500 to-yellow-400 h-full transition-all duration-300";
      } else {
        hpBar.className = "bg-gradient-to-r from-emerald-500 to-green-400 h-full transition-all duration-300";
      }

      // 復活の書所持数バッジ
      const reviveBadge = document.getElementById('hud-revive-badge');
      reviveBadge.textContent = state.items.reviveCount > 0 ? `📖復活の書 ×${state.items.reviveCount}` : "";

      // 右上アイテムボタン描画
      const itemsContainer = document.getElementById('hud-items');
      itemsContainer.innerHTML = "";

      if (state.items.herb) {
        const btn = document.createElement('button');
        btn.className = "px-3 py-1 rounded bg-emerald-900/90 border border-emerald-400 text-emerald-200 text-xs md:text-sm font-bold hover:bg-emerald-700 transition flex items-center gap-1";
        const healAmt = state.jobKey === 'priest' ? 40 : 20;
        btn.innerHTML = `🌿 薬草 (+${healAmt}HP)`;
        btn.onclick = () => useItem('herb');
        itemsContainer.appendChild(btn);
      }

      if (state.items.wand) {
        const btn = document.createElement('button');
        btn.className = "px-3 py-1 rounded bg-sky-900/90 border border-sky-400 text-sky-200 text-xs md:text-sm font-bold hover:bg-sky-700 transition flex items-center gap-1";
        btn.innerHTML = `🪄 魔法の杖 (3択化)`;
        btn.onclick = () => useItem('wand');
        itemsContainer.appendChild(btn);
      }

      if (state.items.apple) {
        const btn = document.createElement('button');
        btn.className = "px-3 py-1 rounded bg-rose-900/90 border border-rose-400 text-rose-200 text-xs md:text-sm font-bold hover:bg-rose-700 transition flex items-center gap-1";
        btn.innerHTML = `🍎 奇跡のリンゴ`;
        btn.onclick = () => useItem('apple');
        itemsContainer.appendChild(btn);
      }

      if (!state.items.herb && !state.items.wand && !state.items.apple) {

    // アイテム使用処理（1回使用したら消える）
    function useItem(type) {
      if (state.inMerchantStage) {
        showEffectBanner("商人ステージではアイテムを使えません！", "text-rose-300 border-rose-400");
        return;
      }

      const stage = MONSTER_STAGES[state.stageIndex];
      const qObj = stage.questions[state.questionIndex];

      if (type === 'herb' && state.items.herb) {
        sound.playHeal();
        state.items.herb = false;
        const heal = state.jobKey === 'priest' ? 40 : 20;
        state.hp = Math.min(state.maxHp, state.hp + heal);
        showEffectBanner(`🌿 薬草を使った！ HPが ${heal} 回復した！`, "text-emerald-300 border-emerald-400");
        updateHUD();
      } else if (type === 'wand' && state.items.wand) {
        sound.playHeal();
        state.items.wand = false;
        reduceOptionsToThree(qObj.answer, qObj.options.length);
        showEffectBanner("🪄 魔法の杖を使った！ 選択肢が3つに絞られた！", "text-sky-300 border-sky-400");
        updateHUD();
        renderBattleQuestion();
      } else if (type === 'apple' && state.items.apple) {
        sound.playFanfare();
        state.items.apple = false;
        const heal = state.jobKey === 'priest' ? 40 : 20;
        state.hp = Math.min(state.maxHp, state.hp + heal);
        state.items.reviveCount += 1;
        reduceOptionsToThree(qObj.answer, qObj.options.length);
        showEffectBanner(`🍎 奇跡のリンゴ発動！HP+${heal}＆3択化＆復活の書+1！`, "text-amber-300 border-amber-400");
        updateHUD();
        renderBattleQuestion();
      }
    }

    // 選択肢を3つ（正解1＋ハズレ2）に減らす
    function reduceOptionsToThree(correctIdx, totalCount) {
      const wrongIndices = [];
      for (let i = 0; i < totalCount; i++) {
        if (i !== correctIdx && !state.disabledOptions.includes(i)) {
          wrongIndices.push(i);
        }
      }
      // シャッフルして消去対象を追加し、残りの有効選択肢が合計3個になるようにする
      wrongIndices.sort(() => Math.random() - 0.5);
      while ((totalCount - state.disabledOptions.length) > 3 && wrongIndices.length > 0) {
        state.disabledOptions.push(wrongIndices.pop());
      }
    }

          btn.innerHTML = `<i class="fa-solid fa-caret-right text-amber-400"></i> <span>${opt.text}</span>`;

    /* ==============================================================
       8. 本編バトル画面（魔物①〜⑤）
       ============================================================== */
    function startMonsterStage() {
      clearTimers();
      state.inMerchantStage = false;
      const stage = MONSTER_STAGES[state.stageIndex];
      state.questionIndex = 0;
      prepareQuestionOptions();

      if (stage.isBoss) {
        sound.playBGM(ASSETS.bgmMaou, true);
      }

      const appearText = stage.isBoss 
        ? `ゴゴゴゴゴ……！！ 闇の奥から「${stage.name}」が姿を現した！！`
        : `野生の「${stage.name}」が現れた！`;

      renderBattleQuestion(appearText, true);
    }

    function prepareQuestionOptions() {
      state.disabledOptions = [];
      const stage = MONSTER_STAGES[state.stageIndex];
      const qObj = stage.questions[state.questionIndex];

      // 魔法使いの特性：最初からハズレ選択肢が1つ自動消去される
      if (state.jobKey === 'mage' && qObj.options.length >= 4) {
        const wrongIndices = [];
        for (let i = 0; i < qObj.options.length; i++) {
          if (i !== qObj.answer) wrongIndices.push(i);
        }
        const removeIdx = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
        state.disabledOptions.push(removeIdx);
      }
    }

    function renderBattleQuestion(customBannerText = null, isFirstAppear = false) {

      updateHUD();

      const stage = MONSTER_STAGES[state.stageIndex];
      const qObj = stage.questions[state.questionIndex];
      const totalQ = stage.questions.length;

      const imgAnimClass = (stage.isBoss && isFirstAppear) ? "maou-fadein" : "";

      let refCompanyHtml = "";

        refCompanyHtml = `
          <a href="${COMPANY_URLS[qObj.refCompany]}" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-1.5 text-xs md:text-sm px-3 py-1 rounded bg-sky-900/80 border border-sky-400 text-sky-200 hover:bg-sky-700 transition mt-2">
            <i class="fa-solid fa-up-right-from-square"></i> ${qObj.refCompany} の公式HPを別タブで見る
          </a>
        `;
      }

      mainScreen.innerHTML = `
        <div class="flex flex-col">
          <!-- 魔物ステータス＆イラストエリア -->
          <div class="flex flex-col items-center mb-4">
            <div class="flex items-center gap-3 mb-2">

            </div>

            <!-- 魔物画像＋斬撃エフェクトレイヤー -->
            <div id="monster-sprite-box" class="slash-container my-1 p-2 rounded-xl bg-slate-950/70 border border-slate-800">
              <div class="slash-line"></div>
              <img id="monster-img" src="${stage.img}" alt="${stage.name}" 
                   class="h-44 md:h-52 object-contain mx-auto ${imgAnimClass}"
                   onerror="this.src='https://placehold.co/300x220/0f172a/f87171?text=${encodeURIComponent(stage.name)}'">
            </div>

            <!-- 登場・状況メッセージ枠 -->
            <div class="rpg-window w-full p-3 text-center">
              <p id="battle-log" class="text-sm md:text-base text-amber-200 font-bold">
                ${customBannerText || `${stage.name}が立ちはだかっている！知識の剣で攻撃せよ！`}
              </p>
              ${state.jobKey === 'mage' ? '<p class="text-xs text-sky-300 mt-1">🔮 魔法使いの特性【データ解析】によりハズレが1つ消去されています</p>' : ''}

          </div>

          <!-- 問題文 -->
          <div class="rpg-window p-4 md:p-5 mb-4">
            <p class="text-base md:text-lg text-white leading-relaxed font-sans font-bold">${qObj.q}</p>
            ${refCompanyHtml}
          </div>

          <!-- 選択肢リスト（回答ボタン） -->
          <div class="text-xs text-slate-400 mb-2 flex justify-between">
            <span>▼ 正解だと思う選択肢を選んで攻撃！（間違えるとHP-10）</span>
          </div>
          <div id="battle-options" class="grid grid-cols-1 gap-2.5"></div>
        </div>
      `;

      const optContainer = document.getElementById('battle-options');

      shuffleArray(optionsWithIndex);

      optionsWithIndex.forEach((opt) => {
        const isDisabled = state.disabledOptions.includes(opt.originalIndex);
        const row = document.createElement('div');
        row.className = "flex items-stretch gap-2";

        const ansBtn = document.createElement('button');
        ansBtn.className = "rpg-btn flex-1 font-sans";
        ansBtn.disabled = isDisabled;
        ansBtn.innerHTML = `<span>${opt.text}</span>`;
        ansBtn.onclick = () => handleBattleAnswer(opt.originalIndex);

        row.appendChild(ansBtn);

        // 企業HPリンクボタンの追加
        if (COMPANY_URLS[opt.text]) {
          const linkBtn = document.createElement('a');
          linkBtn.href = COMPANY_URLS[opt.text];
          linkBtn.target = "_blank";

          linkBtn.title = "公式HPを見る";
          linkBtn.onclick = (e) => e.stopPropagation(); 
          linkBtn.innerHTML = 'HP';

             linkBtn.style.opacity = "0.35";
             linkBtn.style.pointerEvents = "none";
          }
          row.appendChild(linkBtn);
        }

        optContainer.appendChild(row);
      });

    // 回答判定処理
    function handleBattleAnswer(selectedIndex) {
      const stage = MONSTER_STAGES[state.stageIndex];
      const qObj = stage.questions[state.questionIndex];

      if (selectedIndex === qObj.answer) {
        // 正解！スコア計算＆会心の一撃判定
        let gainedScore = 100;
        let isCritical = false;

        if (state.jobKey === 'warrior' && qObj.category === 'warrior') {
          gainedScore = Math.round(gainedScore * 1.8);
          isCritical = true;
        } else if (state.jobKey === 'priest' && qObj.category === 'priest') {
          gainedScore = Math.round(gainedScore * 1.6);
          isCritical = true;
        } else if (state.jobKey === 'mage' && qObj.category === 'mage') {
          gainedScore = Math.round(gainedScore * 1.6);
          isCritical = true;
        } else if (state.jobKey === 'hero') {
          gainedScore = Math.round(gainedScore * (stage.isBoss ? 1.6 : 1.2));
          if (stage.isBoss) isCritical = true;
        }

        state.score += gainedScore;
        updateHUD();

        if (isCritical) {
          showEffectBanner(`⚡ 会心の一撃！！ +${gainedScore} SCORE！`, "text-yellow-300 border-yellow-300");
        } else {
          showEffectBanner(`⭕ 正解！ +${gainedScore} SCORE！`, "text-emerald-300 border-emerald-400");
        }

        // 選択肢をロック
        const optContainer = document.getElementById('battle-options');
        if (optContainer) {
          Array.from(optContainer.querySelectorAll('button')).forEach(b => b.disabled = true);
        }

        const isLastQuestionOfMonster = (state.questionIndex + 1 >= stage.questions.length);
        const monsterImg = document.getElementById('monster-img');
        const spriteBox = document.getElementById('monster-sprite-box');
        const battleLog = document.getElementById('battle-log');

        if (!isLastQuestionOfMonster) {
          // 魔物が揺れてダメージを受けるエフェクト
          sound.playAttackHit();
          if (monsterImg) monsterImg.classList.add('monster-damage');
          if (battleLog) battleLog.textContent = `⚔️ ${stage.name}に大ダメージを与えた！！`;

          const proceedNextQ = () => {
            state.questionIndex += 1;
            prepareQuestionOptions();
            renderBattleQuestion(`${stage.name}は体勢を立て直して襲いかかってきた！`);
          };

          if (qObj.explanation) {
            setTimeout(() => {
              showModal(qObj.explanationTitle || "解説", qObj.explanation, proceedNextQ);
            }, 750);
          } else {
            setTimeout(proceedNextQ, 900);
          }
        } else {
          // 最終問題正解：魔物が斬撃で切れるエフェクト
          sound.playSlashDefeat();
          if (spriteBox) spriteBox.classList.add('slash-active');
          if (monsterImg) monsterImg.classList.add('monster-sliced');
          if (battleLog) battleLog.textContent = `⚔️ 必殺の一撃！！ ${stage.name}を打ち倒した！！`;

          const proceedNextStage = () => {
            // 僧侶の特性：ステージクリアごとにHP+5自動回復
            if (state.jobKey === 'priest' && state.stageIndex < MONSTER_STAGES.length - 1) {
              state.hp = Math.min(state.maxHp, state.hp + 5);
              showEffectBanner("✨ 僧侶の特性【おもてなしの心】でHPが5回復した！", "text-emerald-300 border-emerald-400");
              updateHUD();
            }

            // 魔物③（ミノタウロス: index 2）討伐後は商人ステージへ
            if (state.stageIndex === 2) {
              renderMerchantIntro();
            } else if (state.stageIndex + 1 < MONSTER_STAGES.length) {
              state.stageIndex += 1;
              startMonsterStage();
            } else {
              // 大魔王討伐完了 → エンディングへ
              renderEnding();
            }
          };

          if (qObj.explanation) {
            setTimeout(() => {
              showModal(qObj.explanationTitle || "解説", qObj.explanation, proceedNextStage);
            }, 1000);
          } else {
            setTimeout(proceedNextStage, 1100);
          }
        }
      } else {
        // 不正解：「ブブ！」という音とともにHPから10を引く
        sound.playBuzzer();
        state.hp = Math.max(0, state.hp - 10);
        updateHUD();

        const bodyEl = document.getElementById('game-body');
        bodyEl.classList.remove('player-damaged');
        void bodyEl.offsetWidth; // reflow
        bodyEl.classList.add('player-damaged');

        showEffectBanner("💥 ブブ！ 不正解！ 10のダメージを受けた！", "text-rose-300 border-rose-500");

        const battleLog = document.getElementById('battle-log');
        if (battleLog) {
          battleLog.innerHTML = `<span class="text-rose-400">痛恨のミス！ ${state.playerName}は 10 のダメージを受けた！もう一度選べ！</span>`;
        }

        if (state.hp <= 0) {
          setTimeout(() => {
            renderGameOver();
          }, 550);
        }
      }
    }

      const selectedSet = new Set();

      const contractItems = [
        { id: 0, text: "・時給は １０００円", isIllegal: true },
        { id: 1, text: "・勤務日数により 昇給あり。", isIllegal: false },
        { id: 2, text: "・仕入れの計算ミスは給料から 自腹清算", isIllegal: true },
        { id: 3, text: "・交通費は 全額自己負担", isIllegal: false },
        { id: 4, text: "・成績が悪い場合は１日ごとに 給与見直し", isIllegal: true }
      ];
      shuffleArray(contractItems);

      mainScreen.innerHTML = `
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-3">
            <span class="text-sm md:text-base font-bold text-amber-300">
              <i class="fa-solid fa-pen-nib text-rose-500 mr-1"></i> 違法な条件をすべてタップして赤丸をつけろ！
            </span>
            <div class="px-4 py-1 rounded-lg bg-rose-950 border-2 border-rose-500 text-rose-300 font-bold text-lg">
              残り <span id="contract-timer">30</span> 秒
            </div>
          </div>

          <!-- 契約書（巻物風） -->
          <div class="contract-scroll p-5 md:p-6 mb-4">
            <h3 class="text-center text-xl md:text-2xl font-black border-b-2 border-amber-900 pb-2 mb-4 text-amber-950">
              【アルバイト労働条件契約書】
            </h3>
            <div id="contract-list" class="space-y-3"></div>
          </div>

          <p id="contract-msg" class="text-center text-sm text-amber-300 min-h-[24px] mb-2"></p>

          <button id="contract-ok-btn" class="rpg-btn rpg-btn-primary w-full py-3.5 text-xl">
            OK（この赤丸で判定する！）
          </button>
        </div>
      `;

      const listEl = document.getElementById('contract-list');

      const renderItems = () => {
        listEl.innerHTML = "";
        contractItems.forEach((item) => {
          const div = document.createElement('div');
          const isCircled = selectedSet.has(item.id);
          div.className = `contract-item ${isCircled ? 'circled' : ''}`;
          div.innerHTML = `
            <div class="font-bold text-base md:text-lg text-stone-900">${item.text}</div>
            <div class="red-circle-mark"></div>
          `;
          div.onclick = () => {
            sound.playClick();
            if (selectedSet.has(item.id)) {
              selectedSet.delete(item.id);
            } else {
              selectedSet.add(item.id);
            }
            renderItems();
          };
          listEl.appendChild(div);
        });
      };

      renderItems();

      const finishGame1 = (isSuccess) => {
        clearTimers();
        if (!isSuccess) {
          state.merchantAllClear = false;
          sound.playBuzzer();
        } else {
          sound.playFanfare();
          state.score += 150;
          updateHUD();
        }

        const title = isSuccess 
          ? "⭕ 見破り成功！！（正解：1000円・自腹清算・給与見直し）" 
          : "⏰ 時間切れ！（正解：1000円・自腹清算・給与見直し）";
        const exp = "【解説】\n・１０００円は最低賃金違反。長野県であれば最低時給は１１７０円\n・自腹清算はだめ。わざと会社のものを壊したような場合は弁償もあり得ますが、それも全額というケースは少ない。\n・給与見直し。金額を上げることは問題ありませんが、条件を下げるのはかなり難しい。";

        showModal(title, exp, () => {
          renderMerchantDebate(1);
        });
      };

      // 30秒タイマー
      state.countdownTimer = setInterval(() => {
        timeLeft--;
        const tEl = document.getElementById('contract-timer');
        if (tEl) tEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          finishGame1(false);
        }
      }, 1000);

      // OKボタン判定（間違っていたら赤丸リセット）
      document.getElementById('contract-ok-btn').onclick = () => {
        const correctIds = [0, 2, 4];
        const isExactMatch = (selectedSet.size === correctIds.length) && correctIds.every(id => selectedSet.has(id));

        if (isExactMatch) {
          finishGame1(true);
        } else {
          sound.playBuzzer();
          selectedSet.clear();
          renderItems();
          const msgEl = document.getElementById('contract-msg');
          if (msgEl) {
            msgEl.textContent = "💥 ブブ！組み合わせが違うぞ！赤丸がリセットされた！もう一度選び直せ！";
          }
        }
      };
    }

    // ゲーム2：商人の言い訳を論破しろ！（シチュエーション1 & 2）
    function renderMerchantDebate(step) {
      clearTimers();

      const isStep1 = (step === 1);
      const title = isStep1 ? "シチュエーション１（昼休みの電話番）" : "シチュエーション２（名ばかり店長）";
      const scenarioText = isStep1
        ? "お昼休みの1時間に「電話がかかってくるかもしれないから、カウンターで弁当食べて」と指示されました。結果としてその1時間は1本も電話が鳴らず、完全に自分のスマホを見て過ごせました。すると商人が「何もしなかったんだから、当然給料はなしでいいよな」と言ってきました。\nどれが正しいでしょうか？"
        : "仲間がどんどん辞めてしまい、「店長」に昇進しました！商人から「店長は立派な役職（管理監督者）だから、これから残業代は出ないよ。その代わり役職手当を月1万円あげるね」と言われました。しかし、仕事内容はこれまで通りレジ打ちや品出しがメインで、アルバイトのシフトが回らない時は自分が穴埋めしています。\n正しい考え方は？";

      const options = isStep1
        ? [
            "1本も電話に対応しておらず、実際に休めていたため、通常通り「無給の休憩時間」として扱ってよい。",
            "実際に電話が鳴らなかったとしても、会社の指示でデスクに縛られていたため「労働時間」となり、1時間分の給与（残業代）が発生する。",
            "電話対応という業務は発生しなかったが、場所が制限された手当として「通常の時給の50%」を支払わなければならない。"
          ]
        : [
            "「店長」という名前がつき、役職手当が1円でも出ているなら、法律上「管理職」になるので残業代が出ないのは正しい。",
            "店長であっても、普通の残業代（25%アップ）は出ないが、夜22時以降に働いた分の「深夜手当」や「休日手当」は請求できる。",
            "自分の判断で人を採用したり、働く時間を自由に決めたりできる権限がないなら、名ばかりの店長（名ばかり管理職）なので、会社は残業代を全額払わなければ違法。"
          ];

      const correctIndex = isStep1 ? 1 : 2; // Step1はB(1), Step2はC(2)
      const explanation = isStep1
        ? "労働基準法上の休憩は「労働から『完全に』解放されていること」が条件です。結果的に電話が鳴らなかったとしても、会社の命令で待機している状態（手待ち時間）は会社の指揮命令下にあるとみなされ、立派な「労働時間」になります。したがって、この1時間は休憩とは認められず、残業代の支払い対象になります。"
        : "法律で残業代を出さなくていいとされる「管理監督者」とは、社長と同じくらいの強い権限（採用権など）を持ち、自分の労働時間を自分でコントロールできる人のことです。アルバイトと同じようにシフトに縛られて動いている店長は、名ばかりの管理職であり、会社は残業代を払う義務があります。管理職手当が出ていても深夜手当は請求できますが、休日手当は難しい。";

      mainScreen.innerHTML = `
        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
              <img src="${ASSETS.merchantImg}" alt="商人" class="w-12 h-12 rounded-full object-cover border-2 border-amber-400">
              <div>
                <div class="text-xs text-amber-400 font-bold">２ 商人の言い訳を論破しろ！</div>
                <h3 class="text-base md:text-lg font-bold text-white">${title}</h3>
              </div>
            </div>
            <div id="debate-timer-box" class="hidden px-4 py-1 rounded-lg bg-rose-950 border-2 border-rose-500 text-rose-300 font-bold text-lg">
              残り <span id="debate-timer">30</span> 秒
            </div>
          </div>

          <div class="rpg-window p-5 mb-5">
            <p class="text-base md:text-lg text-white leading-relaxed whitespace-pre-line font-sans">${scenarioText}</p>
          </div>

          <div id="debate-action-area" class="flex flex-col items-center">
            <button id="show-debate-opts-btn" class="rpg-btn rpg-btn-primary px-10 py-3.5 text-lg">
              選択肢表示（30秒カウント開始） <i class="fa-solid fa-list-check ml-2"></i>
            </button>
          </div>
        </div>
      `;

      document.getElementById('show-debate-opts-btn').onclick = () => {
        sound.playClick();
        let timeLeft = 30;
        const timerBox = document.getElementById('debate-timer-box');
        timerBox.classList.remove('hidden');

        const actionArea = document.getElementById('debate-action-area');
        actionArea.innerHTML = `<div id="debate-opts-list" class="w-full grid grid-cols-1 gap-3"></div>`;
        const listEl = document.getElementById('debate-opts-list');

        const optionsWithIndex = options.map((text, idx) => ({ text, originalIndex: idx }));
        shuffleArray(optionsWithIndex);

        const finishDebate = (isCorrect) => {
          clearTimers();
          if (isCorrect) {
            sound.playFanfare();
            state.score += 150;
            updateHUD();
          } else {
            sound.playBuzzer();
            state.merchantAllClear = false;
          }

          const headTitle = isCorrect 
            ? `⭕ 論破成功！！（正解：${isStep1 ? 'B' : 'C'}）`
            : `❌ 論破失敗…（正解：${isStep1 ? 'B' : 'C'}）`;

          showModal(headTitle, explanation, () => {
            if (isStep1) {
              renderMerchantDebate(2);
            } else {
              finishMerchantStage();
            }
          });
        };

        optionsWithIndex.forEach((opt) => {
          const btn = document.createElement('button');
          btn.className = "rpg-btn font-sans text-sm md:text-base";
          btn.innerHTML = `<i class="fa-solid fa-gavel text-amber-400 shrink-0"></i> <span>${opt.text}</span>`;
          btn.onclick = () => {
            finishDebate(opt.originalIndex === correctIndex);
          };
          listEl.appendChild(btn);
        });

        state.countdownTimer = setInterval(() => {
          timeLeft--;
          const tEl = document.getElementById('debate-timer');
          if (tEl) tEl.textContent = timeLeft;
          if (timeLeft <= 0) {
            finishDebate(false);
          }
        }, 1000);
      };
    }

    // 商人ステージ終了時のHP増減判定
    function finishMerchantStage() {
      clearTimers();
      let resultHtml = "";

      if (state.merchantAllClear) {
        sound.playHeal();
        const recover = Math.max(1, Math.ceil(state.hp * 0.2));
        state.hp = Math.min(state.maxHp, state.hp + recover);
        updateHUD();
        resultHtml = `
          <div class="text-4xl mb-3">🍖✨</div>
          <h3 class="text-xl md:text-2xl font-bold text-emerald-400 mb-2">
            バイト代でおもいっきり飲食をして、HPが回復した！
          </h3>
          <p class="text-base text-slate-200 mb-6 font-sans">
            商人の違法な罠をすべて見破り、きっちり正当な報酬を受け取った！（残りHPの20%：+${recover} HP回復！）
          </p>
        `;
      } else {
        sound.playBuzzer();
        const penalty = Math.max(1, Math.ceil(state.hp * 0.3));
        state.hp = Math.max(0, state.hp - penalty);
        updateHUD();
        resultHtml = `
          <div class="text-4xl mb-3">💸💦</div>
          <h3 class="text-xl md:text-2xl font-bold text-rose-400 mb-2">
            ブラックバイトでメンタル削られた！
          </h3>
          <p class="text-base text-slate-200 mb-6 font-sans">
            怪しい商人のペースに巻き込まれ、残りHPの30%（-${penalty} HP）が削られてしまった…！
          </p>
        `;
      }

      mainScreen.innerHTML = `
        <div class="flex flex-col items-center text-center py-6">
          ${resultHtml}
          <button id="to-dragon-btn" class="rpg-btn rpg-btn-primary px-10 py-4 text-lg">
            魔物④（ドラゴン）との戦いへ進む <i class="fa-solid fa-dragon ml-2"></i>
          </button>
        </div>
      `;

      document.getElementById('to-dragon-btn').onclick = () => {
        sound.playClick();
        if (state.hp <= 0) {
          renderGameOver();
        } else {
          state.stageIndex = 3; // 魔物④：ドラゴン
          startMonsterStage();
        }
      };
    }

    /* ==============================================================
       10. ゲームオーバー画面（完全遷移＆復活の書対応）
       ============================================================== */
    function renderGameOver() {
      clearTimers();
      sound.playBGM(ASSETS.bgmOver, false);
      hudBar.classList.add('hidden');

      const job = JOB_DATA[state.jobKey];
      const hasRevive = state.items.reviveCount > 0;

      mainScreen.innerHTML = `
        <div class="flex flex-col items-center text-center py-4">
          <h2 class="text-3xl md:text-4xl font-black text-rose-500 tracking-widest mb-4">GAME OVER</h2>
          <div class="w-full max-w-xl rounded-xl overflow-hidden border-4 border-rose-600 shadow-2xl mb-6 bg-black">
            <img src="${ASSETS.overImg}" alt="ゲームオーバー" class="w-full max-h-[300px] object-cover mx-auto" onerror="this.src='https://placehold.co/600x320/111827/ef4444?text=GAME+OVER'">
          </div>

          <div class="rpg-window w-full p-5 mb-6">
            <p id="gameover-text" class="text-lg md:text-xl leading-relaxed text-rose-200"></p>
          </div>

          <div class="flex flex-col sm:flex-row gap-4 w-full max-w-lg justify-center">
            ${hasRevive ? `
              <button id="use-revive-btn" class="rpg-btn rpg-btn-primary flex-1 py-4 text-lg">
                📖 復活の書を使う（残り${state.items.reviveCount}）
              </button>
            ` : ''}
            <button id="retry-all-btn" class="rpg-btn justify-center border-rose-400 text-rose-200 flex-1 py-4 text-lg">
              <i class="fa-solid fa-rotate-left mr-2"></i> 最初から挑戦する
            </button>
          </div>
        </div>
      `;

      const overMsg = `「${job.name}${state.playerName}よ、死んでしまうとはふがいない。このままでは野沢の平和は取り返せない。何としても再挑戦をしてほしい！」`;
      typeText('gameover-text', overMsg, 45);

      if (hasRevive) {
        document.getElementById('use-revive-btn').onclick = () => {
          sound.playFanfare();
          sound.stopBGM();
          state.items.reviveCount -= 1;
          state.hp = Math.max(50, Math.round(state.maxHp * 0.7));
          hudBar.classList.remove('hidden');
          updateHUD();
          showEffectBanner(`📖 復活の書が輝き、${state.playerName}は蘇った！`, "text-amber-300 border-amber-400");
          if (state.inMerchantStage) {
            state.stageIndex = 3;
            startMonsterStage();
          } else {
            renderBattleQuestion(`復活した${state.playerName}が再び立ち上がった！`);
          }
        };
      }

      document.getElementById('retry-all-btn').onclick = () => {
        sound.playClick();
        resetAllState();
        renderTitle1();
      };
    }

    function resetAllState() {
      state.playerName = "勇者";
      state.jobKey = "hero";
      state.jobScores = { warrior: 0, priest: 0, mage: 0, hero: 0 };
      state.hp = 100;
      state.maxHp = 100;
      state.score = 0;
      state.items = { herb: false, wand: false, apple: false, reviveCount: 0 };
      state.stageIndex = 0;
      state.questionIndex = 0;
      state.inMerchantStage = false;
      state.disabledOptions = [];
    }

    /* ==============================================================
       11. エンディング画面（紙吹雪・称賛テキスト・音楽）
       ============================================================== */
    function renderEnding() {
      clearTimers();
      sound.playBGM(ASSETS.bgmEnding, true);
      hudBar.classList.add('hidden');
      spawnConfetti();

      const job = JOB_DATA[state.jobKey];

      mainScreen.innerHTML = `
        <div class="flex flex-col items-center text-center py-4 relative z-10">
          <div class="px-5 py-1 rounded-full bg-amber-400 text-slate-950 font-black text-sm tracking-widest mb-3 shadow-lg">
            🎉 CONGRATULATIONS // ALL CLEAR 🎉
          </div>
          <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-300 to-yellow-400 mb-5">
            野沢の森に平和が戻った！
          </h1>

          <div class="w-full max-w-2xl rounded-xl overflow-hidden border-4 border-amber-300 shadow-[0_0_40px_rgba(250,204,21,0.5)] mb-6 bg-black">
            <img src="${ASSETS.endingImg}" alt="エンディング" class="w-full max-h-[340px] object-cover mx-auto" onerror="this.src='https://placehold.co/800x420/0f172a/facc15?text=HAPPY+ENDING'">
          </div>

          <div class="rpg-window-gold w-full p-5 md:p-6 mb-6 text-left">
            <div class="text-xs text-amber-300 font-bold mb-2">【伝説の記録】</div>
            <p id="ending-message" class="text-base md:text-xl leading-relaxed text-white min-h-[110px]"></p>
          </div>

          <!-- 最終スコア＆称号ボード -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full mb-7">
            <div class="rpg-window p-3">
              <div class="text-xs text-slate-400">勇者の名前・ジョブ</div>
              <div class="text-lg font-bold text-amber-300 mt-1">${job.icon} ${job.name} ${state.playerName}</div>
            </div>
            <div class="rpg-window p-3">
              <div class="text-xs text-slate-400">最終残りHP</div>
              <div class="text-lg font-bold text-emerald-400 mt-1">HP ${state.hp} / ${state.maxHp}</div>
            </div>
            <div class="rpg-window p-3">
              <div class="text-xs text-slate-400">獲得トータルスコア</div>
              <div class="text-xl font-black text-yellow-300 mt-1">${state.score} PTS</div>
            </div>
          </div>

          <button id="back-to-top-btn" class="rpg-btn rpg-btn-primary px-12 py-4 text-xl">
            <i class="fa-solid fa-house mr-2"></i> 最初に戻る
          </button>
        </div>
      `;

      const praiseText = `${job.name}・${state.playerName}よ！あなたの知恵と地元企業への深い理解によって大魔王は完全に打ち倒され、野沢の森に再び光と平和が戻った！長野県には世界に誇る技術やサービスを持つ素晴らしい企業がたくさんある。${state.playerName}のこれからの未来にも、無限の可能性が広がっているぞ。ありがとう、伝説の勇者${state.playerName}よ！！`;
      typeText('ending-message', praiseText, 42);

      document.getElementById('back-to-top-btn').onclick = () => {
        sound.playClick();
        clearConfetti();
        resetAllState();
        renderTitle1();
      };
    }

    function spawnConfetti() {
      clearConfetti();
      const colors = ['#facc15', '#38bdf8', '#f43f5e', '#34d399', '#c084fc'];
      for (let i = 0; i < 36; i++) {
        const div = document.createElement('div');
        div.className = 'confetti';
        div.style.left = `${Math.random() * 100}vw`;
        div.style.backgroundColor = colors[i % colors.length];
        div.style.animationDuration = `${2.5 + Math.random() * 3}s`;
        div.style.animationDelay = `${Math.random() * 2}s`;
        document.body.appendChild(div);
      }
    }

    function clearConfetti() {
      document.querySelectorAll('.confetti').forEach(el => el.remove());
    }

    // 初期起動
    window.onload = () => {
      renderTitle1();
    };
  </script>
</body>
</html>
